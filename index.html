<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary ❤️</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }

        /* หัวใจตรงกลางแบบนุ่มนวล Minimal */
        .heart-shape {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: #f43f5e;
            transform: rotate(-45deg);
            animation: pulse-soft 2s infinite ease-in-out;
        }
        .heart-shape::before,
        .heart-shape::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #f43f5e;
            border-radius: 50%;
        }
        .heart-shape::before {
            top: -50px;
            left: 0;
        }
        .heart-shape::after {
            left: 50px;
            top: 0;
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.05) rotate(-45deg); }
        }

        /* CSS Animation สำหรับ Modal เปิด/ปิด แบบสมูท */
        .modal-backdrop {
            transition: opacity 0.3s ease-in-out;
        }
        .modal-content {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease-in-out;
        }
        
        .modal-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .modal-hidden .modal-content {
            transform: scale(0.9) translateY(10px);
            opacity: 0;
        }

        .modal-visible {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-visible .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between items-center p-6 relative overflow-x-hidden">

    <!-- Background Pattern จางๆ สไตล์มินิมอล -->
    <div class="absolute inset-0 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px] -z-10 opacity-60"></div>

    <!-- ส่วนหัว (Header) -->
    <header class="text-center mt-6 z-10 space-y-2">
        <span class="text-xs uppercase tracking-widest text-rose-500 font-medium px-3 py-1 bg-rose-50 rounded-full border border-rose-100">Our Special Moment</span>
        <h1 class="text-3xl sm:text-4xl font-semibold text-slate-800 tracking-tight">Happy Anniversary</h1>
        <p class="text-slate-400 text-sm font-light">รวม 7 ช่วงเวลาที่น่าจดจำของเราสองคน</p>
    </header>

    <!-- พื้นที่จัดวางรูปหัวใจ (Heart Interactive Area) -->
    <main class="relative w-[340px] h-[340px] sm:w-[460px] sm:h-[460px] flex justify-center items-center my-auto">
        
        <!-- หัวใจตรงกลาง -->
        <div class="heart-shape shadow-lg shadow-rose-200/50 flex items-center justify-center">
            <span class="transform rotate-[45deg] text-white font-medium text-lg tracking-wider z-20 text-center drop-shadow-sm">
                ALWAYS
            </span>
        </div>

        <!-- รูปภาพ 7 รูปที่จัดวางด้วย JS -->
        <div id="photo-heart-container" class="absolute inset-0 w-full h-full"></div>
    </main>

    <!-- ปุ่มส่งความรัก -->
    <footer class="mb-6 z-10">
        <button onclick="triggerFloatingHearts()" class="bg-slate-900 hover:bg-rose-500 text-white font-normal text-sm py-3 px-7 rounded-full shadow-md hover:shadow-lg hover:shadow-rose-200 transition-all duration-300 transform active:scale-95 flex items-center gap-2">
            <span>ส่งความรัก</span>
            <span class="text-rose-400">❤️</span>
        </button>
    </footer>

    <!-- Smooth Image Modal (หน้าต่างแสดงรูปภาพสมูทๆ) -->
    <div id="imageModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop modal-hidden bg-slate-900/40 backdrop-blur-md" onclick="closeModal()">
        <div class="bg-white rounded-3xl p-4 sm:p-5 max-w-sm sm:max-w-md w-full shadow-2xl border border-slate-100 modal-content relative" onclick="event.stopPropagation()">
            <!-- ปุ่มปิด -->
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-full w-8 h-8 flex items-center justify-center transition-colors">
                ✕
            </button>
            
            <!-- รูปภาพขนาดใหญ่ -->
            <div class="overflow-hidden rounded-2xl aspect-square bg-slate-100 mb-4">
                <img id="modalImage" src="" alt="Enlarged photo" class="w-full h-full object-cover">
            </div>

            <!-- ข้อความกำกับรูปภาพ -->
            <div class="text-center px-2 pb-2">
                <h3 id="modalTitle" class="text-lg font-medium text-slate-800">ความทรงจำของเรา</h3>
                <p id="modalCaption" class="text-xs text-slate-400 mt-1">กดพื้นที่ว่างภายนอกเพื่อปิด</p>
            </div>
        </div>
    </div>

    <script>
        // 1. กำหนดชื่อไฟล์รูปภาพเป็น 1.jpg ถึง 7.jpg พร้อมข้อความกำกับ
        const memoryData = [
            { url: '1.jpg', title: 'จุดเริ่มต้นของเรา', caption: 'รอยยิ้มแรกที่ทำให้ตกหลุมรัก' },
            { url: '2.webp', title: 'ทริปแรกด้วยกัน', caption: 'การเดินทางที่มีเธอข้างๆ' },
            { url: '3.jpg', title: 'วันที่แสนพิเศษ', caption: 'ไม่ว่าทำอะไรก็มีความสุขเสมอ' },
            { url: '4.webp', title: 'วันสบายๆ ของเรา', caption: 'แค่อยู่ด้วยกันก็พอแล้ว' },
            { url: '5.jpg', title: 'ภาพถ่ายโปรด', caption: 'รูปนี้เธอสวยที่สุดเลย' },
            { url: '6.jpg', title: 'ร้านอร่อยร้านโปรด', caption: 'กินอะไรก็อร่อยเมื่อมีเธอ' },
            { url: '7.png', title: 'ครบรอบเดือนนี้', caption: 'ขอบคุณที่เดินจับมือกันมาถึงวันนี้นะ' }
        ];

        // 2. สมการรูปหัวใจ (Heart Curve Formula)
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        const container = document.getElementById('photo-heart-container');
        const totalItems = memoryData.length;

        // 3. วาดวงกลมรูปภาพ 7 รูป
        memoryData.forEach((data, index) => {
            const t = (index / totalItems) * 2 * Math.PI;
            const point = getHeartPoint(t);

            const isSmallScreen = window.innerWidth < 640;
            const scale = isSmallScreen ? 9.5 : 13; 

            const xPos = point.x * scale;
            const yPos = point.y * scale;

            const imgWrapper = document.createElement('div');
            imgWrapper.className = `absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 
                                    w-14 h-14 sm:w-18 sm:h-18 rounded-full bg-white p-1
                                    shadow-md hover:shadow-xl ring-1 ring-slate-100
                                    cursor-pointer transition-all duration-300 ease-out
                                    hover:scale-125 hover:z-30 hover:ring-rose-300`;
            
            imgWrapper.style.transform = `translate(calc(-50% + ${xPos}px), calc(-50% + ${yPos}px))`;

            imgWrapper.innerHTML = `
                <div class="w-full h-full rounded-full overflow-hidden">
                    <img src="${data.url}" alt="${data.title}" class="w-full h-full object-cover">
                </div>
            `;

            // เพิ่ม Event คลิกเพื่อเปิด Modal สมูทๆ
            imgWrapper.addEventListener('click', () => openModal(data));

            container.appendChild(imgWrapper);
        });

        // 4. ฟังก์ชันควบคุม Modal แบบ Smooth
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalCaption = document.getElementById('modalCaption');

        function openModal(data) {
            modalImg.src = data.url;
            modalTitle.textContent = data.title;
            modalCaption.textContent = data.caption;
            
            modal.classList.remove('modal-hidden');
            modal.classList.add('modal-visible');
        }

        function closeModal() {
            modal.classList.remove('modal-visible');
            modal.classList.add('modal-hidden');
        }

        // ปิด Modal เมื่อกดปุ่ม ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // 5. เอฟเฟกต์หัวใจลอยนุ่มนวล
        function triggerFloatingHearts() {
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.innerText = '🤍';
                heart.className = 'fixed text-xl pointer-events-none z-50 transition-all duration-1000 ease-out';
                heart.style.left = (Math.random() * 80 + 10) + 'vw';
                heart.style.top = '100vh';
                heart.style.opacity = '0.8';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.style.transform = `translateY(-${Math.random() * 60 + 30}vh) scale(${Math.random() * 0.8 + 0.6})`;
                    heart.style.opacity = '0';
                }, 50);

                setTimeout(() => heart.remove(), 1050);
            }
        }
    </script>
</body>
</html>
