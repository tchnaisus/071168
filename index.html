<!DOCTYPE html>
<html lang="th" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letter - ค๊อปเตอร์ & ปาล์ม</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        #app {
            background: #ffffff;
            text-align: center;
        }

        /* แอนิเมชั่นการลอยแบบคลีนๆ */
        .envelope {
            position: relative;
            width: 360px;
            height: 240px;
            cursor: pointer;
            margin: 0 auto 30px;
            animation: envelopeFloat 4s ease-in-out infinite;
        }

        @keyframes envelopeFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .envelope-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            z-index: 1;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: #fcfcfc;
            border: 1px solid #eeeeee;
            border-radius: 8px 8px 0 0;
            transform-origin: top center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            clip-path: polygon(0 0, 50% 100%, 100% 0);
        }

        .envelope.opened .envelope-flap {
            transform: rotateX(180deg);
            z-index: 0;
        }

        /* ตัว Card จดหมาย: มีพื้นหลังขาวและขอบบางๆ แต่ไม่มีเงา */
        .letter {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            width: 330px;
            background: #ffffff; /* กลับมามีพื้นหลังแผ่นกระดาษ */
            border: 1px solid #eeeeee; /* ขอบบางๆ ให้ดูคลีน */
            border-radius: 8px;
            padding: 25px;
            z-index: 2;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* เมื่อเปิดซอง ให้ Card ลอยสูงขึ้น */
        .envelope.opened .letter {
            opacity: 1;
            transform: translateX(-50%) translateY(-170px) scale(1);
        }

        .couple-photo-section {
            display: flex;
            justify-content: center;
        }

        .couple-photo {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fcfcfc;
        }

        .letter-top-line,
        .letter-bottom-line {
            height: 1px;
            background: #f5f5f5;
            width: 100%;
        }

        #message-text {
            font-size: 15px;
            line-height: 1.6;
            color: #666;
            margin: 5px 0;
        }

        #signature-text {
            font-weight: 600;
            color: #333;
        }

        #hint {
            color: #cccccc;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="app">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">ที่รักของเค้า</h1>
        <p class="text-sm text-gray-600 mb-10">จาก <span id="sender-display">ค๊อปเตอร์</span> ถึง <span
                id="receiver-display">ปาล์ม</span></p>

        <div id="envelope" class="envelope" onclick="toggleEnvelope()">
            <div class="letter">
                <div class="letter-top-line"></div>
                <div class="couple-photo-section">
                    <img id="couple-photo" class="couple-photo" src="รูปคู่.png" alt="รูปคู่">
                </div>
                <p id="message-text">เค้าขอบคุณเธอที่อยู่ข้างเค้า เสมอมา <br> เค้ารักเธอมากๆเลยนะ ไอ้อ้วน 🩷 6M</p>
                <div class="letter-bottom-line"></div>
                <p id="signature-text">ค๊อปเตอร์</p>
            </div>
            
            <div class="envelope-body"></div>
            <div class="envelope-flap"></div>
        </div>

        <p id="hint">แตะเพื่อเปิดอ่าน</p>
    </div>

    <script>
        const envelope = document.getElementById('envelope');
        const hint = document.getElementById('hint');
        let isOpened = false;

        function toggleEnvelope() {
            isOpened = !isOpened;
            if (isOpened) {
                envelope.classList.add('opened');
                hint.textContent = 'ขอบคุณมากๆ อ้วนของเค้า';
            } else {
                envelope.classList.remove('opened');
                hint.textContent = 'แตะเพื่อเปิดอ่าน';
            }
        }
    </script>
</body>

</html>
